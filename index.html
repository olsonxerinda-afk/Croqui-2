<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Mesas - Cristina & Ussumane</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f7f5f0;
    text-align: center;
}

.brand-title {
    color: #b89759;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 10px;
    text-transform: uppercase;
}

h1 {
    color: #555;
    font-size: 17px;
    font-weight: normal;
    margin-bottom: 20px;
}

.search-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 20px;
}

.search-input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #b89759;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search-input:focus {
    box-shadow: 0 0 12px #b8975966;
}

.no-results {
    min-height: 25px;
    margin-top: 10px;
    font-weight: bold;
    color: #d9534f;
}

.map-wrapper {
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: auto;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 8px 25px #0003;
}

.map-image {
    width: 100%;
    height: auto;
    display: block;
}

/* MARCADORES DAS MESAS */
.pin {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 6.5%;
    height: 16%;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
}

.pin.active {
    opacity: 1;
    background: rgba(255, 0, 0, .35);
    border: 3px solid #ff2222;
    box-shadow: 0 0 20px 8px rgba(255, 0, 0, .7);
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(1);
    }
    to {
        transform: translate(-50%, -50%) scale(1.12);
    }
}

/* ESPAÇOS ESPECIAIS */
.pin.special {
    width: 22%;
    height: 18%;
}

.pin.pista {
    width: 21%;
    height: 24%;
}

@media(max-width:600px) {
    body {
        padding: 10px;
    }
    .brand-title {
        font-size: 25px;
    }
    h1 {
        font-size: 14px;
    }
    .search-input {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="brand-title">Cristina e Ussumane</div>

<h1>Localizador de Mesas e Espaços</h1>

<div class="search-container">
    <!-- Adicionado o atributo list para ativar as sugestões automáticas -->
    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Digite ou selecione o número da mesa..."
        autocomplete="off"
        list="sugestoes-mesas"
    >
    
    <!-- Lista de sugestões que aparece para o usuário -->
    <datalist id="sugestoes-mesas">
        <option value="Mesa 1">
        <option value="Mesa 2">
        <option value="Mesa 3">
        <option value="Mesa 4">
        <option value="Mesa 5">
        <option value="Mesa 6">
        <option value="Mesa 7">
        <option value="Mesa 8">
        <option value="Mesa 9">
        <option value="Mesa 10">
        <option value="Mesa 11">
        <option value="Mesa 12">
        <option value="Mesa 13">
        <option value="Mesa 14">
        <option value="Mesa 15">
        <option value="Mesa 16">
        <option value="Mesa 17">
        <option value="Mesa de Honra">
        <option value="Pista de dança">
    </datalist>

    <div id="statusMessage" class="no-results"></div>
</div>

<div class="map-wrapper">
    <!-- MAPA 3D -->
    <img
        src="CROQUI 2.png"
        class="map-image"
        alt="Mapa 3D de mesas Cristina e Ussumane"
    >

    <!-- LADO ESQUERDO -->
    <div class="pin" id="mesa3" style="left:9.2%;top:20.5%;"></div>
    <div class="pin" id="mesa1" style="left:21.2%;top:24%;"></div>
    <div class="pin" id="mesa2" style="left:31%;top:21%;"></div>
    <div class="pin" id="mesa6" style="left:8.5%;top:43%;"></div>
    <div class="pin" id="mesa5" style="left:20.5%;top:44%;"></div>
    <div class="pin" id="mesa4" style="left:31%;top:40%;"></div>
    <div class="pin" id="mesa7" style="left:8.4%;top:68%;"></div>
    <div class="pin" id="mesa8" style="left:20%;top:68%;"></div>
    <div class="pin" id="mesa9" style="left:31.5%;top:66%;"></div>

    <!-- LADO DIREITO -->
    <div class="pin" id="mesa10" style="left:69.5%;top:22%;"></div>
    <div class="pin" id="mesa11" style="left:84.5%;top:22%;"></div>
    <div class="pin" id="mesa12" style="left:69.5%;top:43%;"></div>
    <div class="pin" id="mesa13" style="left:82%;top:40%;"></div>
    <div class="pin" id="mesa15" style="left:93%;top:48%;"></div>
    <div class="pin" id="mesa14" style="left:70%;top:67%;"></div>
    <div class="pin" id="mesa17" style="left:83.5%;top:67%;"></div>
    <div class="pin" id="mesa16" style="left:95%;top:69%;"></div>

    <!-- ESPAÇOS ESPECIAIS -->
    <div class="pin special" id="honra" style="left:47%;top:9%;"></div>
    <div class="pin pista" id="pista" style="left:49%;top:42%;"></div>
</div>

<script>
const searchInput = document.getElementById("searchInput");
const statusMessage = document.getElementById("statusMessage");
const pins = document.querySelectorAll(".pin");

/* LISTA DE MESAS (Aceita tanto números puros quanto "mesa X") */
const mesas = {
    "1": "mesa1", "2": "mesa2", "3": "mesa3", "4": "mesa4", "5": "mesa5",
    "6": "mesa6", "7": "mesa7", "8": "mesa8", "9": "mesa9", "10": "mesa10",
    "11": "mesa11", "12": "mesa12", "13": "mesa13", "14": "mesa14",
    "15": "mesa15", "16": "mesa16", "17": "mesa17",

    "mesa 1": "mesa1", "mesa 2": "mesa2", "mesa 3": "mesa3", "mesa 4": "mesa4",
    "mesa 5": "mesa5", "mesa 6": "mesa6", "mesa 7": "mesa7", "mesa 8": "mesa8",
    "mesa 9": "mesa9", "mesa 10": "mesa10", "mesa 11": "mesa11", "mesa 12": "mesa12",
    "mesa 13": "mesa13", "mesa 14": "mesa14", "mesa 15": "mesa15",
    "mesa 16": "mesa16", "mesa 17": "mesa17",

    "honra": "honra", "mesa de honra": "honra",
    "pista": "pista", "pista de danca": "pista"
};

/* FUNÇÃO DE PESQUISA INTELIGENTE */
searchInput.addEventListener("input", function() {
    const query = this.value
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    // Remover destaques anteriores de todos os pinos
    pins.forEach(pin => {
        pin.classList.remove("active");
    });

    statusMessage.textContent = "";

    if (query === "") {
        return;
    }

    const targetId = mesas[query];

    if (targetId) {
        const target = document.getElementById(targetId);

        if (target) {
            target.classList.add("active");
            
            // Rolar suavemente a tela para centralizar o mapa na mesa encontrada
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });

            statusMessage.style.color = "green";
            if (targetId === "honra") {
                statusMessage.textContent = "Mesa de Honra encontrada!";
            } else if (targetId === "pista") {
                statusMessage.textContent = "Pista de dança encontrada!";
            } else {
                statusMessage.textContent = "Mesa " + targetId.replace("mesa", "") + " encontrada!";
            }
        }
    } else {
        statusMessage.style.color = "#d9534f";
        statusMessage.textContent = "Mesa não encontrada! Escolha uma mesa de 1 a 17.";
    }
});
</script>

</body>
</html>
